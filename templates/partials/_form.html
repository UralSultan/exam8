{% csrf_token %}

{% for field in form %}
    <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {% for error in field.errors %}
            <div class="error">{{ error }}</div>
        {% endfor %}
    </div>
{% endfor %}

{% for error in form.non_field_errors %}
    <div class="error">{{ error }}</div>
{% endfor %}
