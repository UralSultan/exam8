{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Forum{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'scc/style.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'discussions:topic_list' %}">Forum</a>

        {% if user.is_authenticated %}
            <span>{{ user.username }}</span>

            <form action="{% url 'accounts:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Войти</a>
            <a href="{% url 'accounts:register' %}">Регистрация</a>
        {% endif %}
    </header>

    <hr>

    {% block content %}
    {% endblock %}
</body>
</html>
