{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anime Forum{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <nav class="container nav">
            <a class="logo" href="{% url 'discussions:topic_list' %}">Anime Forum</a>

            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'discussions:topic_create' %}">Новая тема</a>
                    <span>{{ user.username }}</span>
                    <form action="{% url 'accounts:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Войти</a>
                    <a href="{% url 'accounts:register' %}">Регистрация</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
