{% extends 'base.html' %}

{% block title %}Удалить тему{% endblock %}

{% block content %}
<section class="panel">
    <h1>Удалить тему</h1>
    <p>Вы уверены, что хотите удалить тему "{{ topic.title }}"?</p>

    <form method="post" class="form">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{{ topic.get_absolute_url }}">Отмена</a>
    </form>
</section>
{% endblock %}
